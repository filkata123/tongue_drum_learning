<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Tongue Drum Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="start" class="screen">
    <h1>Tongue Drum</h1>
    <button id="start-btn" type="button">Start</button>
    <p id="start-hint" class="hint">Allow the microphone when asked, then play the number you see.</p>
    <p id="start-error" class="error" hidden></p>
  </main>

  <main id="play" class="screen" hidden>
    <header>
      <button id="piece-name" type="button" aria-haspopup="dialog">
        <span id="piece-title"></span>
        <small id="piece-part"></small>
      </button>
    </header>

    <!-- Reserved for Listen and its speed control (#37); hidden until then. -->
    <div id="listen-row" class="reserved"></div>

    <div id="stage">
      <div id="steps">
        <!-- The Location hint: the target's half of the drum map, only when you're stuck. -->
        <div id="hint"></div>
        <div id="current" class="step"></div>
        <div id="next">
          <div class="step"></div>
          <div class="step"></div>
          <div class="step"></div>
        </div>
      </div>
      <p id="feedback"></p>
    </div>

    <footer>
      <div id="controls">
        <button id="restart-btn" type="button">Start</button>
        <!-- Reserved for the Timed switch (#38); hidden until then. -->
        <div id="timed" class="reserved"></div>
      </div>
      <p id="debug" hidden></p>
      <div id="note-bars" hidden></div>
      <p id="sim-hint" class="hint" hidden>Sim mode: keys 1–7 = middle row, Z X C V B = lower 3–7, 8 9 0 = upper 1–3</p>
      <div id="level"><div id="level-bar"></div></div>
    </footer>

    <div id="done" hidden>
      <div class="check">✓</div>
      <div id="done-text"></div>
    </div>

    <div id="pieces" role="dialog" aria-label="Pieces" hidden>
      <div id="pieces-head">
        <span>Pieces</span>
        <button id="pieces-close" type="button" aria-label="Close">✕</button>
      </div>
      <div id="pieces-groups"></div>
      <button id="add-song" type="button">+ Add song</button>
    </div>

    <div id="editor" role="dialog" aria-label="Add song" hidden>
      <div id="editor-head">
        <span>Add song</span>
        <button id="editor-close" type="button" aria-label="Close">✕</button>
      </div>
      <button id="copy-prompt" type="button">Copy conversion prompt</button>
      <p class="hint">Paste it into any chatbot with a photo of your sheet, then paste its answer below.</p>
      <textarea id="song-text" spellcheck="false" autocapitalize="off" autocomplete="off"
        placeholder="title: …&#10;melody: …&#10;accomp: …"></textarea>
      <ul id="song-errors"></ul>
      <button id="save-song" type="button">Save</button>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
