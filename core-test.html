<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Practice core tests</title>
  <style>body { font-family: ui-monospace, monospace; background: #111827; color: #f9fafb; padding: 1rem; } .fail { color: #f87171; } .pass { color: #22c55e; }</style>
</head>
<body>
  <h1>Practice core tests</h1>
  <pre id="out"></pre>
  <script type="module">
    // Cache-busted so a plain reload always tests the latest code.
    const bust = `?v=${Date.now()}`;
    const { createPracticeCore } = await import(`./core.js${bust}`);
    const { parseSongText } = await import(`./songtext.js${bust}`);
    const { EXERCISES, NOTE_BY_ID, DRUM_NOTES } = await import(`./notes.js${bust}`);

    const out = document.getElementById("out");
    const results = [];

    function check(name, got, want) {
      const ok = JSON.stringify(got) === JSON.stringify(want);
      results.push({ name, ok });
      out.innerHTML += `<span class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</span> ${name}\n`
        + (ok ? "" : `     want ${JSON.stringify(want)}\n     got  ${JSON.stringify(got)}\n`);
    }

    // localStorage stand-in.
    function fakeStorage(entries = {}) {
      const m = new Map(Object.entries(entries));
      return {
        getItem: (k) => (m.has(k) ? m.get(k) : null),
        setItem: (k, v) => m.set(k, String(v)),
        removeItem: (k) => m.delete(k),
      };
    }

    // A repeatable stand-in for Math.random.
    function seeded(seed) {
      let s = seed;
      return () => (s = (s * 16807) % 2147483647) / 2147483647;
    }

    // A core on a clock the test moves by hand: t.now += 300.
    function setup(storage = fakeStorage()) {
      const t = { now: new Date(2026, 9, 20, 9).getTime() };
      const core = createPracticeCore({ storage, clock: () => t.now, random: seeded(1) });
      return { t, core, storage };
    }

    const ids = (step) => step.tongues.map((tg) => tg.id);

    // Song text, through the parser seam (rhythm isn't visible in Step mode yet).
    {
      const notes = (line) => line.map((n) => `${n.tongue}@${n.start}+${n.length}`).join(" ");
      const melody = (text) => notes(parseSongText(`title: T\nmelody: ${text}`).lines.melody);
      check("title comes from the title line", parseSongText("title:  Morning tune \nmelody: 1").title, "Morning tune");
      check("a plain number is one beat", melody("1 2 3"), "1@0+1 2@1+1 3@2+1");
      check("each / halves a note", melody("1/ 2// 3"), "1@0+0.5 2@0.5+0.25 3@0.75+1");
      check(". makes a note half as long again", melody("1. 2/ 3/. 4"), "1@0+1.5 2@1.5+0.5 3@2+0.75 4@2.75+1");
      check("- holds one more beat", melody("1 - - 2 -"), "1@0+3 2@3+2");
      check("0 is a rest: it takes time but isn't a note", melody("1 0 2/ 0/ 3"), "1@0+1 2@2+0.5 3@3+1");
      check("| is a bar line and takes no time", melody("1 2 | 3 - |"), "1@0+1 2@1+1 3@2+2");
      check("_ is a lower note and ˙ an upper note", melody("_6 ˙1 _5/"), "_6@0+1 ˙1@1+1 _5@2+0.5");
      check("^ works like ˙", melody("^1 ^3/"), "˙1@0+1 ˙3@1+0.5");
      check("spacing doesn't matter", melody("1/2/|3"), "1@0+0.5 2@0.5+0.5 3@1+1");

      const one = parseSongText("title: One line\nmelody: 1 2");
      check("a one-line piece has no accompaniment and no both steps", [one.lines.accomp, one.both], [undefined, undefined]);

      const two = parseSongText("title: Two\nmelody: 3 5/ 6/ 5 - |\naccomp: 1 0 _5/ _6/ 0 |");
      check("the accompaniment line is parsed too", notes(two.lines.accomp), "1@0+1 _5@2+0.5 _6@2.5+0.5");
      check("both steps: notes starting at the same moment become one chord step, melody first",
        two.both.map((s) => `${s.tongues.join("+")}@${s.start}`).join(" "), "3+1@0 5@1 6@1.5 5+_5@2 _6@2.5");
    }

    {
      const { core } = setup();
      let v = core.send({ type: "tick" });
      check("first render shows the first exercise, not yet playing",
        [v.piece.title, v.piece.group, v.playing, v.position], ["D major scale", "exercise", false, 0]);
      check("steps are the exercise's tongues, none heard yet",
        v.steps.map(ids).join(" "), "1 2 3 4 5 6 7 ˙1");
      v = core.send({ type: "start" });
      check("start begins playing on the first step", [v.playing, v.position], [true, 0]);
    }

    {
      const { t, core } = setup();
      core.send({ type: "start" });
      let v = core.send({ type: "strike", tongue: "3", at: t.now }); // the scale starts on 1
      check("wrong tongue says what it was", v.feedback.thatWas, "3");
      check("wrong tongue stays on the step", v.position, 0);
      const first = v.feedback.seq;
      v = core.send({ type: "strike", tongue: "3", at: t.now });
      check("the same miss again restarts the shake", v.feedback.seq > first, true);
    }

    {
      const { t, core } = setup();
      core.send({ type: "start" });
      core.send({ type: "strike", tongue: "3", at: t.now });
      let v = core.send({ type: "strike", tongue: "1", at: t.now });
      check("right tongue is heard straight away, during the flash",
        [v.steps[0].tongues[0].heard, v.position], [true, 0]);
      check("right tongue clears 'That was'", v.feedback, null);
      t.now += 100;
      v = core.send({ type: "strike", tongue: "2", at: t.now });
      check("strikes during the flash are ignored", v.steps[1].tongues[0].heard, false);
      t.now += 149;
      check("still on the step just before the flash ends", core.send({ type: "tick" }).position, 0);
      t.now += 1;
      v = core.send({ type: "tick" });
      check("right tongue moves on after the flash", [v.position, v.steps[1].tongues[0].heard], [1, false]);
    }

    // A strike as the detector reports it: `sounding` is [tongue, onset ms from now], loudest first,
    // and the detector's single-note verdict is the loudest.
    function report(t, ...sounding) {
      const ranked = sounding.map(([tongue, from], i) => ({ tongue, level: 1 / (i + 1), at: t.now + from }));
      return { type: "strike", tongue: ranked[0].tongue, at: t.now, ranked };
    }

    // Hits every remaining step of the current piece, waiting out each flash. Chords are struck
    // together.
    function playThrough(t, core) {
      let v = core.send({ type: "tick" });
      while (!v.done) {
        core.send(report(t, ...ids(v.steps[v.position]).map((id) => [id, 0])));
        t.now += 300;
        v = core.send({ type: "tick" });
      }
      return v;
    }

    {
      const { t, core } = setup();
      core.send({ type: "start" });
      let v = playThrough(t, core);
      check("finishing a piece says which piece was done", v.done.title, "D major scale");
      check("every step was heard", v.steps.every((s) => s.tongues[0].heard), true);
      const firstDone = v.done.seq;
      v = core.send({ type: "strike", tongue: "3", at: t.now });
      check("strikes while done is showing are ignored", v.feedback, null);
      t.now += 1500;
      v = core.send({ type: "tick" });
      check("after done, the same piece starts again from its first step",
        [v.done, v.piece.title, v.position, v.steps[0].tongues[0].heard, v.playing],
        [null, "D major scale", 0, false, true]);
      v = playThrough(t, core);
      check("finishing it again flashes done again", [v.done.title, v.done.seq > firstDone], ["D major scale", true]);
      t.now += 60000;
      v = core.send({ type: "tick" });
      check("nothing moves on to another piece by itself",
        [v.piece.title, v.position, v.done], ["D major scale", 0, null]);
    }

    {
      const { t, core } = setup();
      core.send({ type: "start" });
      core.send({ type: "strike", tongue: "1", at: t.now });
      t.now += 300;
      core.send({ type: "strike", tongue: "2", at: t.now });
      t.now += 300;
      core.send({ type: "tick" });
      const v = core.send({ type: "start" });
      check("Start plays the current piece from step 1",
        [v.piece.title, v.position, v.steps.some((s) => s.tongues[0].heard)], ["D major scale", 0, false]);
    }

    {
      const writes = [];
      const storage = fakeStorage({ "tongue-drum:melody": "5" });
      const setItem = storage.setItem;
      storage.setItem = (k, v) => { writes.push(k); setItem(k, v); };
      const { t, core } = setup(storage);
      let v = core.send({ type: "tick" });
      check("the old saved melody index is ignored", v.piece.title, "D major scale");
      core.send({ type: "start" });
      playThrough(t, core);
      t.now += 1500;
      core.send({ type: "tick" });
      check("the old melody index is never written", writes.includes("tongue-drum:melody"), false);
    }

    {
      const pieces = EXERCISES.map((e) => parseSongText(e.text));
      check("every exercise has a title and notes", pieces.every((p) => p.title && p.lines.melody.length > 0), true);
      check("every exercise note is a tongue on the drum",
        pieces.flatMap((p) => [...p.lines.melody, ...(p.lines.accomp ?? [])]).filter((n) => !NOTE_BY_ID[n.tongue]), []);
      const twoLine = pieces.filter((p) => p.lines.accomp);
      check("2–3 two-line exercises exist", twoLine.length >= 2 && twoLine.length <= 3, true);
      check("each two-line exercise has chord steps", twoLine.every((p) => p.both.some((s) => s.tongues.length === 2)), true);
      check("no chord asks for one tongue twice", twoLine.every((p) => p.both.every((s) => new Set(s.tongues).size === s.tongues.length)), true);
    }

    // The piece list.
    {
      const storage = fakeStorage();
      const { core } = setup(storage);
      let v = core.send({ type: "pick", pieceId: "simple-phrase" });
      check("picking a piece makes it the current piece", v.piece.title, "Simple phrase");
      v = setup(storage).core.send({ type: "tick" });
      check("the current piece persists across a fresh core on the same storage", v.piece.title, "Simple phrase");
      v = setup().core.send({ type: "tick" });
      check("a fresh device's current piece is the first exercise", v.piece.title, "D major scale");
      v = setup(fakeStorage({ "tongue-drum:piece": "no-such-piece" })).core.send({ type: "tick" });
      check("a saved piece that no longer exists falls back to the first exercise", v.piece.title, "D major scale");
    }

    {
      const { t, core } = setup();
      core.send({ type: "start" });
      core.send({ type: "strike", tongue: "1", at: t.now });
      t.now += 300;
      core.send({ type: "strike", tongue: "5", at: t.now }); // a miss on step 2
      let v = core.send({ type: "pick", pieceId: "up-and-down" });
      check("picking a piece mid-run stops the run on its first step, with nothing heard",
        [v.piece.title, v.playing, v.position, v.feedback, v.steps.some((s) => s.tongues[0].heard)],
        ["Up and down", false, 0, null, false]);
      v = core.send({ type: "strike", tongue: "1", at: t.now });
      check("strikes after picking are ignored until Start", v.steps[0].tongues[0].heard, false);
      v = core.send({ type: "start" });
      check("Start plays the picked piece from step 1",
        [v.piece.title, v.playing, v.position, v.steps.map(ids).join(" ")], ["Up and down", true, 0, "1 3 5 7 5 3 1"]);
    }

    {
      const { t, core } = setup();
      core.send({ type: "start" });
      playThrough(t, core);
      let v = core.send({ type: "pick", pieceId: "classic-step" });
      check("picking while done is showing clears done", [v.done, v.playing], [null, false]);
      t.now += 1500;
      v = core.send({ type: "tick" });
      check("the old piece's restart doesn't fire after a pick", [v.piece.title, v.playing, v.done], ["Classic step", false, null]);
    }

    {
      const { core } = setup();
      check("no overlay is open at first", core.send({ type: "tick" }).overlay, null);
      core.send({ type: "pick", pieceId: "simple-phrase" });
      let v = core.send({ type: "open", what: "pieces" });
      check("the piece list has two groups, Exercises then My songs",
        [v.overlay.kind, v.overlay.groups.map((g) => g.title)], ["pieces", ["Exercises", "My songs"]]);
      const [exercises, mySongs] = v.overlay.groups;
      check("Exercises lists every exercise in order",
        exercises.pieces.map((p) => p.title).slice(0, 3), ["D major scale", "Simple phrase", "Up and down"]);
      check("My songs is empty until a song is added", mySongs.pieces, []);
      check("only the current piece is marked current",
        exercises.pieces.filter((p) => p.current).map((p) => p.id), ["simple-phrase"]);
      check("exercises are read-only", exercises.pieces.some((p) => p.editable), false);
      v = core.send({ type: "close" });
      check("close shuts the piece list and keeps the current piece", [v.overlay, v.piece.title], [null, "Simple phrase"]);
      core.send({ type: "open", what: "pieces" });
      v = core.send({ type: "pick", pieceId: "upper-octave" });
      check("picking a piece shuts the list, back to the main screen", [v.overlay, v.piece.title], [null, "Upper octave"]);
    }

    {
      const { t, core } = setup();
      core.send({ type: "start" });
      let v = core.send({ type: "open", what: "pieces" });
      check("opening the list mid-run doesn't stop the run", v.playing, true);
      v = core.send({ type: "strike", tongue: "1", at: t.now });
      check("strikes are ignored while the list is open", [v.steps[0].tongues[0].heard, v.feedback], [false, null]);
      core.send({ type: "close" });
      v = core.send({ type: "strike", tongue: "1", at: t.now });
      check("closing the list carries on with the run", [v.playing, v.steps[0].tongues[0].heard], [true, true]);
    }

    {
      const { core } = setup();
      const v = core.send({ type: "pick", pieceId: "bells-two-lines" });
      check("a two-line piece plays its melody line in Step mode", v.steps.map(ids).join(" "), "5 3 5 3 1");
      check("a two-line piece's header part is the melody line", v.piece.part, "melody");
      check("a one-line piece has no part", core.send({ type: "pick", pieceId: "simple-phrase" }).piece.part, null);
      let threw = false;
      try { core.send({ type: "pick", pieceId: "no-such-piece" }); } catch { threw = true; }
      check("picking an unknown piece throws", threw, true);
    }

    {
      const { t, core } = setup();
      const a = core.send({ type: "start" });
      t.now += 1000;
      check("a tick with nothing changed returns the same snapshot", core.send({ type: "tick" }) === a, true);
      const b = core.send({ type: "strike", tongue: "3", at: t.now });
      check("a change returns a new snapshot", b !== a, true);
      check("the old snapshot is left as it was", a.feedback, null);
    }

    {
      const { t, core } = setup();
      let v = core.send({ type: "strike", tongue: "3", at: t.now });
      check("strikes before Start are ignored", v.feedback, null);
      core.send({ type: "start" });
      core.send({ type: "strike", tongue: "1", at: t.now });
      t.now += 300;
      core.send({ type: "strike", tongue: "5", at: t.now });
      v = core.send({ type: "start" });
      check("Restart goes back to the first step and clears 'That was'",
        [v.position, v.steps[0].tongues[0].heard, v.feedback, v.playing], [0, false, null, true]);
    }

    {
      const { t, core } = setup();
      core.send({ type: "start" });
      for (const tongue of ["1", "2", "3", "4", "5", "6", "7"]) {
        core.send({ type: "strike", tongue, at: t.now });
        t.now += 300;
        core.send({ type: "tick" });
      }
      core.send({ type: "strike", tongue: "˙1", at: t.now });
      t.now += 10000; // the screen was asleep: no ticks through the flash and done
      const v = core.send({ type: "tick" });
      check("one late tick catches up through the flash and done",
        [v.piece.title, v.position, v.done], ["D major scale", 0, null]);
    }

    // Add song.
    const songsIn = (v) => v.overlay.groups[1].pieces;

    {
      const { t, core } = setup();
      core.send({ type: "open", what: "pieces" });
      let v = core.send({ type: "open", what: "editor" });
      check("Add song opens an empty paste box", [v.overlay.kind, v.overlay.text, v.overlay.errors], ["editor", "", []]);
      v = core.send({ type: "saveSong", text: "title: Morning tune\nmelody: 3 5 | 6 - |" });
      check("a valid paste goes back to the piece list", v.overlay.kind, "pieces");
      check("the saved song appears in My songs, editable",
        songsIn(v).map((p) => [p.title, p.editable]), [["Morning tune", true]]);
      v = core.send({ type: "pick", pieceId: songsIn(v)[0].id });
      check("a saved song can be picked", [v.piece.title, v.piece.group], ["Morning tune", "my-song"]);
      v = core.send({ type: "start" });
      check("a saved song plays its notes", v.steps.map(ids).join(" "), "3 5 6");
      v = playThrough(t, core);
      check("a saved song finishes like any piece", v.done.title, "Morning tune");
    }

    {
      const { core } = setup();
      core.send({ type: "open", what: "editor" });
      core.send({ type: "saveSong", text: "title: First\nmelody: 1" });
      core.send({ type: "open", what: "editor" });
      const v = core.send({ type: "saveSong", text: "title: Second\nmelody: 2" });
      check("each saved song is added after the last", songsIn(v).map((p) => p.title), ["First", "Second"]);
      check("each saved song has its own id", new Set(songsIn(v).map((p) => p.id)).size, 2);
    }

    {
      const { core } = setup();
      core.send({ type: "open", what: "editor" });
      const v = core.send({ type: "saveSong", text: "title: Phone typed\nmelody: ^1 ^3/ 7 | _5 - |" });
      check("^ is accepted wherever ˙ is", core.send({ type: "pick", pieceId: songsIn(v)[0].id }).steps.map(ids).join(" "), "˙1 ˙3 7 _5");
    }

    {
      const storage = fakeStorage();
      const { core } = setup(storage);
      core.send({ type: "open", what: "editor" });
      let v = core.send({ type: "saveSong", text: "title: Kept\nmelody: 5 3 | 1 - |" });
      core.send({ type: "pick", pieceId: songsIn(v)[0].id });
      const fresh = setup(storage).core;
      v = fresh.send({ type: "tick" });
      check("a saved song survives a fresh core on the same storage, still current",
        [v.piece.title, v.piece.group, v.steps.map(ids).join(" ")], ["Kept", "my-song", "5 3 1"]);
      fresh.send({ type: "open", what: "editor" });
      v = fresh.send({ type: "saveSong", text: "title: Another\nmelody: 1" });
      check("songs added after a reload join the saved ones", songsIn(v).map((p) => p.title), ["Kept", "Another"]);
      v = setup(fakeStorage({ "tongue-drum:songs": "{not json" })).core.send({ type: "open", what: "pieces" });
      check("corrupt saved songs mean an empty My songs, not a crash", songsIn(v), []);
    }

    // A bad paste: every error comes back at once, each naming its bar, and nothing is saved.
    function badPaste(text) {
      const storage = fakeStorage();
      const { core } = setup(storage);
      core.send({ type: "open", what: "editor" });
      const v = core.send({ type: "saveSong", text });
      const after = setup(storage).core.send({ type: "open", what: "pieces" });
      return { v, saved: songsIn(core.send({ type: "open", what: "pieces" })).length + songsIn(after).length };
    }

    {
      const { v, saved } = badPaste("title: Too low\nmelody: 1 2 | _1 3 | ˙5 - |");
      check("a note not on the drum is refused, naming its bar",
        [v.overlay.kind, v.overlay.errors], ["editor", [
          { bar: 2, message: "bar 2: _1 isn't on the drum" },
          { bar: 3, message: "bar 3: ˙5 isn't on the drum" },
        ]]);
      check("a refused paste keeps its text in the box", v.overlay.text, "title: Too low\nmelody: 1 2 | _1 3 | ˙5 - |");
      check("a refused paste saves nothing", saved, 0);
    }

    {
      const { v, saved } = badPaste("title: Typos\nmelody: 1 2 | 3 x 4 | 5 8 |\naccomp: 1 - | _5 * - | 1 |");
      check("unknown symbols are refused, naming their bar and line", v.overlay.errors, [
        { bar: 2, message: 'bar 2: "x" in the melody isn\'t a song text symbol' },
        { bar: 3, message: 'bar 3: "8" in the melody isn\'t a song text symbol' },
        { bar: 2, message: 'bar 2: "*" in the accompaniment isn\'t a song text symbol' },
      ]);
      check("a paste with unknown symbols saves nothing", saved, 0);
    }

    {
      const { v, saved } = badPaste("title: Uneven\nmelody: 1 2 3 4 | 5 - - | 6/ 6/ 5 |\naccomp: 1 - - - | _5 - - - | 1 - - - | _5 |");
      check("bars of different lengths are refused, naming the bar and both lengths", v.overlay.errors, [
        { bar: 2, message: "bar 2: melody 3 beats, accompaniment 4" },
        { bar: 3, message: "bar 3: melody 2 beats, accompaniment 4" },
        { bar: 4, message: "bar 4: melody 0 beats, accompaniment 1" },
      ]);
      check("a paste with uneven bars saves nothing", saved, 0);
    }

    {
      const { v } = badPaste("title: Pickup\nmelody: 6/ 7/ | ˙1. 7/ ˙1 ˙3 | 7 - - 3 |\naccomp: 0 | _6 3 6 3 | _5 2 5 2 |");
      check("bars of the same length, with a pickup bar and dotted notes, are fine", v.overlay.kind, "pieces");
    }

    {
      const { v, saved } = badPaste("title: All wrong\nmelody: 1 _1 | 2 ? |\naccomp: 1 - - |");
      check("every kind of error comes back together", v.overlay.errors.map((e) => e.message), [
        "bar 1: _1 isn't on the drum",
        'bar 2: "?" in the melody isn\'t a song text symbol',
        "bar 1: melody 2 beats, accompaniment 3",
        "bar 2: melody 1 beat, accompaniment 0",
      ]);
      check("nothing is saved until the whole song checks out", saved, 0);
    }

    {
      const { v, saved } = badPaste("melody: 0 0 |");
      check("a paste with no title and no notes says so", v.overlay.errors, [
        { bar: null, message: "The title: line is missing" },
        { bar: null, message: "The melody has no notes" },
      ]);
      check("a paste with no title saves nothing", saved, 0);
    }

    {
      const { core } = setup();
      core.send({ type: "open", what: "editor" });
      core.send({ type: "saveSong", text: "title: Bad\nmelody: 9" });
      const v = core.send({ type: "saveSong", text: "title: Fixed\nmelody: 1" });
      check("fixing a refused paste saves it", songsIn(v).map((p) => p.title), ["Fixed"]);
    }

    {
      const { core } = setup();
      const prompt = core.send({ type: "open", what: "editor" }).overlay.conversionPrompt;
      check("the conversion prompt ends by asking for only the song text", /output only the song text/i.test(prompt), true);
      check("the conversion prompt explains every song text symbol",
        ["title:", "melody:", "accomp:", "_", "˙", "^", "/", ".", "-", "0", "|"].filter((s) => !prompt.includes(`"${s}"`)), []);
      check("the conversion prompt only offers the notes that are on the drum",
        ["_3", "˙3"].every((id) => prompt.includes(id)) && !prompt.includes("_2"), true);
      const example = prompt.match(/```\n([\s\S]*?)\n```/)?.[1] ?? "";
      const v = core.send({ type: "saveSong", text: example });
      check("the conversion prompt's example is a two-line song that saves cleanly",
        [example.includes("accomp:"), v.overlay.kind], [true, "pieces"]);

    // The Location hint. `1` sits on the drum's right half, `7` and `5` on its left.
    function playSong(text, storage) {
      const s = setup(storage);
      s.core.send({ type: "open", what: "editor" });
      const v = s.core.send({ type: "saveSong", text });
      s.core.send({ type: "pick", pieceId: songsIn(v).at(-1).id });

    const HINT_SONG = "title: Hint test\nmelody: 1 7 1 7 1 7 1 7";

      const { t, core } = playSong(HINT_SONG);

      check("a step starts with no hint", v.hint, null);
      v = core.send({ type: "strike", tongue: "3", at: t.now });

      v = core.send({ type: "strike", tongue: "3", at: t.now });

        v.hint, { half: "right", lit: ["1"], wrong: "3" });
      v = core.send({ type: "strike", tongue: "7", at: t.now });
      check("a miss on the other half still shows the target's half, without the wrong tongue",
        [v.feedback.thatWas, v.hint], ["7", { half: "right", lit: ["1"], wrong: null }]);
      t.now += 20000;
      check("the hint stays while the step isn't hit", core.send({ type: "tick" }).hint, { half: "right", lit: ["1"], wrong: null });

    // Made-up tunes.
    const MADE_UP = { "made-up-middle": ["1", "2", "3", "4", "5", "6", "7"], "made-up-whole": DRUM_NOTES.map((n) => n.id) };
    const tuneOf = (v) => v.steps.map((s) => s.tongues[0].id);
    function seededCore(seed, storage = fakeStorage()) {
      const t = { now: new Date(2026, 9, 20, 9).getTime() };
      return { t, core: createPracticeCore({ storage, clock: () => t.now, random: seeded(seed) }) };
    }

    {
      const { core } = setup();
      const exercises = core.send({ type: "open", what: "pieces" }).overlay.groups[0].pieces;
      check("both made-up tunes are listed under Exercises",
        exercises.filter((p) => p.id in MADE_UP).map((p) => p.title), ["Made-up tune: middle row", "Made-up tune: whole drum"]);
      check("neither made-up tune is first in the list", exercises[0].id in MADE_UP, false);
      check("made-up tunes are read-only", exercises.filter((p) => p.id in MADE_UP).some((p) => p.editable), false);
    }

    // Every shaping rule from #15, over many seeds, for both made-up tunes.
    for (const [pieceId, row] of Object.entries(MADE_UP)) {
      const broken = { length: [], tongues: [], start: [], end: [], answer: [], question: [], jump: [], repeats: [], part: [] };
      const at = (tongue) => row.indexOf(tongue); // the tongue's place on this row, low to high
      const halfDrum = Math.floor(row.length / 2);
      const tunes = new Set();
      let moves = 0, small = 0, big = 0;
      for (let seed = 1; seed <= 300; seed++) {
        const v = seededCore(seed).core.send({ type: "pick", pieceId });
        const tune = tuneOf(v);
        const name = `${seed}: ${tune.join(" ")}`;
        tunes.add(tune.join(" "));
        if (tune.length !== 8 || v.steps.some((s) => s.tongues.length !== 1)) broken.length.push(name);
        if (tune.some((tg) => at(tg) < 0)) { broken.tongues.push(name); continue; }
        if (!["1", "3", "5"].includes(tune[0])) broken.start.push(name);
        if (tune[7] !== "1") broken.end.push(name);
        if (tune[4] !== tune[0] || tune[5] !== tune[1]) broken.answer.push(name);
        if (tune[3] === "1") broken.question.push(name);
        if (v.piece.part !== null) broken.part.push(name);
        for (let i = 1; i < tune.length; i++) {
          const move = Math.abs(at(tune[i]) - at(tune[i - 1]));
          moves++;
          if (move <= 2) small++;
          else big++;
          if (move > halfDrum) broken.jump.push(name);
          if (i >= 2 && tune[i] === tune[i - 1] && tune[i] === tune[i - 2]) broken.repeats.push(name);
        }
      }
      check(`${pieceId}: always 8 one-tongue steps, melody line only`, [broken.length, broken.part], [[], []]);
      check(`${pieceId}: only tongues from its row`, broken.tongues, []);
      check(`${pieceId}: starts on 1, 3 or 5`, broken.start, []);
      check(`${pieceId}: ends on 1`, broken.end, []);
      check(`${pieceId}: the answer phrase starts like the question`, broken.answer, []);
      check(`${pieceId}: the question doesn't end on 1`, broken.question, []);
      check(`${pieceId}: never a jump of more than half the row`, broken.jump, []);
      check(`${pieceId}: never more than two of the same tongue in a row`, broken.repeats, []);
      check(`${pieceId}: mostly small moves (≥ 75% one or two places)`, small / moves >= 0.75, true);
      check(`${pieceId}: a bigger jump now and then`, big > 0, true);
      check(`${pieceId}: different seeds make different tunes`, tunes.size >= 100, true);
    }

    {
      const storage = fakeStorage();
      const { t, core } = seededCore(7, storage);
      const first = tuneOf(core.send({ type: "pick", pieceId: "made-up-whole" }));
      let v = core.send({ type: "start" });
      check("Start plays the tune that's showing", tuneOf(v), first);
      core.send({ type: "strike", tongue: v.steps[0].tongues[0].id, at: t.now });
      t.now += 300;
      v = core.send({ type: "start" });
      check("Restart replays the same tune from step 1", [tuneOf(v), v.position], [first, 0]);
      v = playThrough(t, core);
      check("a made-up tune finishes like any piece", [v.done.title, tuneOf(v)], ["Made-up tune: whole drum", first]);
      t.now += 1500;
      v = core.send({ type: "tick" });
      const second = tuneOf(v);
      check("finishing a made-up tune makes a new one, from step 1, still playing",
        [v.piece.id, second.join(" ") !== first.join(" "), second.length, v.position, v.playing, v.done],
        ["made-up-whole", true, 8, 0, true, null]);
      v = core.send({ type: "open", what: "pieces" });
      check("the made-up tune is marked current in the list",
        v.overlay.groups[0].pieces.filter((p) => p.current).map((p) => p.id), ["made-up-whole"]);
      v = core.send({ type: "pick", pieceId: "made-up-whole" });
      check("picking the made-up tune again makes a new one", tuneOf(v).join(" ") !== second.join(" "), true);
      v = seededCore(8, storage).core.send({ type: "tick" });
      check("a picked made-up tune persists as the exercise, with a tune made up for the fresh core",
        [v.piece.id, tuneOf(v).length, tuneOf(v)[7]], ["made-up-whole", 8, "1"]);
    }

    {
      const { t, core } = seededCore(3);
      core.send({ type: "pick", pieceId: "made-up-middle" });
      const v = core.send({ type: "start" });
      const target = v.steps[0].tongues[0].id;
      const wrong = target === "3" ? "5" : "3";
      core.send({ type: "strike", tongue: wrong, at: t.now });
      const hint = core.send({ type: "strike", tongue: wrong, at: t.now }).hint;
      check("the Location hint appears on a made-up tune step as on any piece",
        [hint?.half, hint?.lit], [{ 1: "right", 3: "right", 5: "left" }[target], [target]]); // a tune starts on 1, 3 or 5
    }

    // The Location hint with two-line pieces.
    {
      const { t, core } = setup();
      pickNewSong(core, DUET);
      core.send({ type: "start" });
      t.now += 5000; // the hint appears on the first step
      playThrough(t, core);
      t.now += 1500;
      check("a run where the hint was shown isn't all first-strike hits, so it stays in its part",
        core.send({ type: "tick" }).piece.part, "melody");
    }

    {
      const { t, core } = inBoth(); // the first step is 3+1, both on the right half
      t.now += 5000;
      check("the hint on a chord step lights both tongues", core.send({ type: "tick" }).hint, { half: "right", lit: ["3", "1"], wrong: null });
      core.send({ type: "start" });
      core.send(report(t, ["3", 0]));
      const v = core.send(report(t, ["3", 0]));
      check("after half a chord twice, the hint lights only the missing tongue", v.hint, { half: "right", lit: ["1"], wrong: null });
    }

    {
      const { t, core } = setup();
      pickNewSong(core, "title: Wide\nmelody: 7 7\naccomp: 1 1"); // 7 on the left half, 1 on the right
      cleanRun(t, core);
      cleanRun(t, core);
      core.send({ type: "start" });
      t.now += 5000;
      check("the hint on a chord across both halves shows the whole drum",
        core.send({ type: "tick" }).hint, { half: "whole", lit: ["7", "1"], wrong: null });
    }

    // Chord steps straight away: a song saved with its part already at both lines.
    function playChords(text, entries = {}) {
      return playSong(text, fakeStorage({ "tongue-drum:parts": JSON.stringify({ "song-1": "both" }), ...entries }));
    }

    {
      const { t, core } = playChords("title: Left\nmelody: 5 7\naccomp: _5 _7"); // 5+_5, all on the left half
      t.now += 5000;
      check("the hint on a chord on the left half shows the left half",
        core.send({ type: "tick" }).hint, { half: "left", lit: ["5", "_5"], wrong: null });
    }

    {
      const { t, core } = inBoth(); // 3+1
      t.now += 5000;
      core.send({ type: "tick" }); // the hint shows both tongues
      const v = core.send(report(t, ["1", 0]));
      check("half a chord with the hint showing lights only the missing tongue", v.hint, { half: "right", lit: ["3"], wrong: null });
    }

    {
      const { t, core } = playChords("title: Wide\nmelody: 7 7\naccomp: 1 1"); // 7 on the left, 1 on the right
      core.send(report(t, ["7", 0]));
      let v = core.send(report(t, ["7", 0]));
      check("a split chord, half heard: the missing tongue's own half, only it lit", v.hint, { half: "right", lit: ["1"], wrong: null });
      v = core.send(report(t, ["1", 0]));
      check("…and the other way round", v.hint, { half: "left", lit: ["7"], wrong: null });
    }

    {
      const { t, core } = inBoth(); // 3+1
      core.send({ type: "start" }); // a fresh step: inBoth waits long enough for the hint
      let v = core.send(report(t, ["3", 0]));
      check("one tongue of a chord is one miss: no hint yet", [heardIn(v.steps[0]), v.hint], [["3"], null]);
      v = core.send(report(t, ["4", 0]));
      check("one tongue of a chord, then a wrong tongue, is the 2nd miss: the hint shows",
        [v.feedback?.thatWas, v.hint], ["4", { half: "right", lit: ["1"], wrong: "4" }]);
    }

    // The fade on chord steps. Both part: 3+1 three times, then 3 alone, then 1 alone.
    const CHORD_FADE = "title: Chord fade\nmelody: 3 3 3 3 1\naccomp: 1 1 1 0 0";
    const chordAndWait = (t, core, ...tongues) => {
      core.send(report(t, ...tongues.map((tg) => [tg, 0])));
      t.now += 300;
      return core.send({ type: "tick" });
    };

    {
      const { t, core } = playChords(CHORD_FADE);
      for (let i = 0; i < 3; i++) chordAndWait(t, core, "3", "1");
      t.now += 60000;
      let v = core.send({ type: "tick" });
      check("3 unaided chord hits fade the first tongue's hint", [ids(v.steps[v.position]), v.hint], [["3"], null]);
      v = chordAndWait(t, core, "3");
      t.now += 60000;
      v = core.send({ type: "tick" });
      check("…and the second's", [ids(v.steps[v.position]), v.hint], [["1"], null]);
    }

    {
      const { t, core } = playChords(CHORD_FADE);
      t.now += 5000;
      chordAndWait(t, core, "3", "1"); // after the hint appeared
      chordAndWait(t, core, "3", "1");
      chordAndWait(t, core, "3", "1");
      t.now += 5000;
      let v = core.send({ type: "tick" });
      check("a chord hit after the hint appeared doesn't add to the first tongue's fade",
        [ids(v.steps[v.position]), v.hint], [["3"], { half: "right", lit: ["3"], wrong: null }]);
      chordAndWait(t, core, "3");
      t.now += 5000;
      v = core.send({ type: "tick" });
      check("…nor to the second's", [ids(v.steps[v.position]), v.hint], [["1"], { half: "right", lit: ["1"], wrong: null }]);
    }

    // The settings gear: one "Location hints" switch, on by default and remembered.
    {
      const storage = fakeStorage();
      const { core } = setup(storage);
      let v = core.send({ type: "open", what: "gear" });
      check("the gear opens with Location hints on", v.overlay, { kind: "gear", hints: true, tempo: null });
      v = core.send({ type: "setHints", on: false });
      check("the switch turns Location hints off", v.overlay.hints, false);
      check("closing the gear goes back to the main screen", core.send({ type: "close" }).overlay, null);
      const fresh = setup(storage);
      check("the switch survives a fresh core on the same storage",
        fresh.core.send({ type: "open", what: "gear" }).overlay.hints, false);
      fresh.core.send({ type: "setHints", on: true });
      check("and so does turning it back on", setup(storage).core.send({ type: "open", what: "gear" }).overlay.hints, true);
    }

    {
      const { core } = setup(fakeStorage({ "tongue-drum:hints": "{oops" }));
      check("a corrupt switch means hints are on", core.send({ type: "open", what: "gear" }).overlay.hints, true);
    }

    // Hints off: no hint ever appears, but the fade is still tracked.
    const hintsOff = () => fakeStorage({ "tongue-drum:hints": "false" });

    {
      const { t, core } = playSong(HINT_SONG, hintsOff());
      core.send({ type: "strike", tongue: "3", at: t.now });
      let v = core.send({ type: "strike", tongue: "3", at: t.now });
      check("with hints off, the 2nd miss shows only 'That was'", [v.feedback.thatWas, v.hint], ["3", null]);
      t.now += 60000;
      check("with hints off, no hint after any wait", core.send({ type: "tick" }).hint, null);
    }

    {
      const { t, core } = playSong(HINT_SONG);
      t.now += 5000;
      core.send({ type: "tick" });
      check("turning hints off takes away a hint that's showing", core.send({ type: "setHints", on: false }).hint, null);
    }

    {
      const { t, core } = playSong(HINT_SONG, hintsOff());
      for (const tongue of ["1", "7", "1", "7", "1", "7"]) {
        t.now += 5000; // long enough that the hint would have shown
        strikeAndWait(t, core, tongue);
      }
      core.send({ type: "setHints", on: true });
      t.now += 60000;
      check("hits with hints off count towards the fade, however slow", core.send({ type: "tick" }).hint, null);
    }

    {
      const storage = hintsOff();
      const { t, core } = playSong(HINT_SONG, storage);
      for (const tongue of ["1", "7", "1", "7", "1", "7"]) strikeAndWait(t, core, tongue);
      core.send({ type: "strike", tongue: "3", at: t.now }); // a miss on the faded `1`, hints off
      core.send({ type: "setHints", on: true });
      const fresh = playSong(HINT_SONG, storage);
      fresh.t.now += 5000;
      check("a miss with hints off brings the tongue's hint back", fresh.core.send({ type: "tick" }).hint?.lit, ["1"]);
    }

    {
      const { t, core } = inBoth(); // the first step is 3+1
      core.send({ type: "setHints", on: false });
      t.now += 5000;
      check("with hints off, no hint on a chord step after a wait", core.send({ type: "tick" }).hint, null);
      core.send(report(t, ["3", 0]));
      const v = core.send(report(t, ["3", 0]));
      check("with hints off, no hint after half a chord twice", v.hint, null);
    }

    const failed = results.filter((r) => !r.ok).length;
    out.innerHTML += `\n${failed ? `<span class="fail">${failed} failed</span>` : '<span class="pass">all passed</span>'}\n`;
    window.testResults = { failed, out: out.textContent };
  </script>
</body>
</html>
